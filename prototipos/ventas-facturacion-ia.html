<script>
const I = {

// Example data
const months = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct"];
const sales = [38,42,51,47,55,61,44,39,58,64];
const billed = [36,40,49,45,52,60,43,37,55,52];
const invoices = [
  { n:"F-2026-0149", c:"Nortia Logística SL", d:"27/10/2026", due:"—", base:5200, st:"Borrador" },
  { n:"F-2026-0148", c:"Nortia Logística SL", d:"12/10/2026", due:"11/11/2026", base:8400, st:"Pendiente" },

// Charts drawn with one linear scale (0-70 k€)
function barChart(w = 560, h = 190) {
  const pad = { l: 34, r: 8, t: 10, b: 22 }, max = 70, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const y = (v) => pad.t + ih - (v / max) * ih, bw = iw / months.length;
  let g = "";
  for (let v = 0; v <= max; v += 20) g += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${y(v)+3}" text-anchor="end">${v}k</text>`;
  months.forEach((m, i) => {
    const x = pad.l + i * bw + bw * 0.18, bwi = bw * 0.3;
    g += `<rect x="${x}" y="${y(sales[i])}" width="${bwi}" height="${y(0)-y(sales[i])}" rx="2" fill="var(--fg)"/>`;
    g += `<rect x="${x+bwi+2}" y="${y(billed[i])}" width="${bwi}" height="${y(0)-y(billed[i])}" rx="2" fill="var(--muted)" opacity=".45"/>`;
    g += `<text x="${pad.l + i*bw + bw/2}" y="${h-6}" text-anchor="middle">${m}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Ventas y facturado por mes">${g}</svg><div class="legend"><span><i style="background:var(--fg)"></i>Vendido</span><span><i style="background:var(--muted);opacity:.45"></i>Facturado</span></div></div>`;
}
function lineChart(w = 560, h = 170) {
  const pad = { l: 34, r: 12, t: 10, b: 22 }, max = 70, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const all = [...sales, 62.5], n = all.length;
  const x = (i) => pad.l + (i / (n - 1)) * iw, y = (v) => pad.t + ih - (v / max) * ih;
  let g = "";
  for (let v = 0; v <= max; v += 20) g += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${y(v)+3}" text-anchor="end">${v}k</text>`;
  const pts = sales.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  g += `<polygon points="${x(0)},${y(0)} ${pts} ${x(9)},${y(0)}" fill="var(--fg)" opacity=".06"/>`;
  g += `<polygon points="${x(9)},${y(64)} ${x(10)},${y(66)} ${x(10)},${y(59)}" fill="var(--info)" opacity=".18"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
  g += `<line x1="${x(9)}" y1="${y(64)}" x2="${x(10)}" y2="${y(62.5)}" stroke="var(--info)" stroke-width="2" stroke-dasharray="4 4"/>`;
  g += `<circle cx="${x(9)}" cy="${y(64)}" r="4" fill="var(--fg)"/><circle cx="${x(10)}" cy="${y(62.5)}" r="4" fill="var(--info)"/>`;
  [...months, "Nov"].forEach((m, i) => g += `<text x="${x(i)}" y="${h-6}" text-anchor="middle">${m}</text>`);
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Ventas mensuales y previsión de noviembre">${g}</svg><div class="legend"><span><i style="background:var(--fg)"></i>Vendido</span><span><i style="background:var(--info)"></i>Previsión del agente</span></div></div>`;
}

// Picker
let cur = 0;
const picker = document.getElementById("picker");
picker.innerHTML = P.map((p, i) => `<button class="chip" type="button" data-i="${i}"><span class="n">${i + 1}</span>${p.name}</button>`).join("");
function show(i) {
  cur = (i + P.length) % P.length;
  const p = P[cur];
  document.getElementById("p-title").textContent = `${cur + 1}. ${p.name}`;
  document.getElementById("p-desc").textContent = p.desc;
  document.getElementById("p-pro").textContent = p.pro;
  document.getElementById("p-con").textContent = p.con;
  document.getElementById("frame").innerHTML = p.html();
  picker.querySelectorAll(".chip").forEach((b, j) => { b.classList.toggle("active", j === cur); b.setAttribute("aria-pressed", j === cur); });
  try { history.replaceState(null, "", "#p" + (cur + 1)); } catch (_) {}
}
picker.addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) show(+b.dataset.i); });
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
const m = /^#p(\d)$/.exec(location.hash);
show(m ? +m[1] - 1 : 0);
</script>
